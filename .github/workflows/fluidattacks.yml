name: Fluid Attacks scanners

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: fluidattacks/sast-action@1.3.0
        id: scan
        with:
          scan_config_path: .fluidattacks/sast.yaml
          scanner_mode: full
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fluidattacks-sast-csv
          path: fluidattacks-sast.csv
      # The action turns the scanner's exit code 1 into an output instead of failing the job
      - name: Break the build
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: |
          echo "::error::SAST found vulnerabilities at or above the high threshold"
          exit 1

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fluidattacks/sca-action@1.2.0
        id: scan
        with:
          scan_config_path: .fluidattacks/sca.yaml
          scanner_mode: full
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fluidattacks-sca-csv
          path: fluidattacks-sca.csv
      - name: Break the build
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: |
          echo "::error::SCA found vulnerable dependencies at or above the high threshold"
          exit 1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 0.3.0 runs an older ss image that ignores strictness_threshold
      - uses: fluidattacks/ss-action@8e60f25a4bddb636a4f3f897b33ae20a75184ded
        id: scan
        with:
          scan_config_path: .fluidattacks/ss.yaml
          scanner_mode: full
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fluidattacks-ss-csv
          path: fluidattacks-ss.csv
      - name: Break the build
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: |
          echo "::error::Secret Scan found secrets at or above the high threshold"
          exit 1
