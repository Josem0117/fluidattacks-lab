name: Fluid Attacks scanners

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: fluidattacks/sast-action@1.3.0
        with:
          scan_config_path: .fluidattacks/sast.yaml
          scanner_mode: full

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fluidattacks/sca-action@1.2.0
        with:
          scan_config_path: .fluidattacks/sca.yaml
          scanner_mode: full

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 0.3.0 runs an older ss image that ignores strictness_threshold
      - uses: fluidattacks/ss-action@8e60f25a4bddb636a4f3f897b33ae20a75184ded
        with:
          scan_config_path: .fluidattacks/ss.yaml
          scanner_mode: full